<!DOCTYPE html>
<html lang="jp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地方自治体決算ターミナル @ 財政革新会</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Datatype:wght@100..900&display=swap" rel="stylesheet"
        media="print" onload="this.media='all'">
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Datatype:wght@100..900&display=swap" rel="stylesheet">
    </noscript>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="datatable.css">
    <link rel="stylesheet" href="bool-inline-z.css">
    <link rel="stylesheet" href="delta-ui-kpi-card.css">
    <link rel="stylesheet" href="two-year-compare.css">
    <link rel="stylesheet" href="kpi-card-group.css">
    <link rel="stylesheet" href="kokuhoken-koei.css">
</head>

<body>

    <!-- TITLE BAR -->
    <div id="topbar">
        <div class="topbar-titles">
            <span class="title-org-name">財政革新会</span>
            <span class="title-app-name">R5 地方自治体決算</span>
        </div>
    </div>

    <!-- BACK BAR -->
    <div id="backbar" style="display:none">
        <button class="back-btn" onclick="navigate('/')">&#8592; 一覧へ戻る</button>
        <button class="copy-url-btn" id="copy-url-btn" onclick="copyCurrentUrl()">&#128279; URLをコピー</button>
    </div>

    <!-- SEARCH BAR -->
    <div id="searchbar" style="display:none">
        <div class="search-terminal-line">
            <span class="search-prompt">&gt;_</span>
            <input id="cb-search" class="search-input" type="text" placeholder="自治体名・都道府県名で検索..." />
        </div>
        <span id="cb-count" class="search-count">
            <span class="search-count-num">—</span>
            <span>件</span>
        </span>
    </div>

    <!-- CONTENTS -->
    <div id="main">
        <div id="tab-loading" class="tab-panel active">
            <div class="loading-prompt">
                <span class="loading-gt">&gt;_</span>
                <span class="loading-msg">データを読み込んでいます</span>
                <span class="loading-cursor"></span>
            </div>
        </div>
        <div id="tab-notfound" class="tab-panel">
            <div class="nf-code">404</div>
            <div class="nf-msg">ページが見つかりません</div>
            <button class="nf-btn" onclick="navigate('/')">← ホームへ戻る</button>
        </div>
        <div id="tab-browse" class="tab-panel entity-grid">

        </div>
        <div id="tab-detail" class="tab-panel">

        </div>
    </div>

    <!-- FOOTER -->
    <footer id="footer">
        <div class="footer-inner">
            <span class="footer-copy">&copy; 2025 財政革新会</span>
            <span class="footer-sep">|</span>
            <span class="footer-source">
                <a href="https://www.soumu.go.jp/iken/kessan_card.html" target="_blank" rel="noopener">
                    総務省「令和５年度　市町村別決算状況調」
                </a>
            </span>
        </div>
    </footer>

    <script type="module">
        import { parquetRead, parquetMetadata, parquetMetadataAsync } from 'https://cdn.jsdelivr.net/npm/hyparquet/+esm'
        // ══════════════════════════════════════════════
        // DATA
        // ══════════════════════════════════════════════
        let data_kessan = []
        let data_todohuken = []
        let data_zeimoku = []
        let data_named_card = []
        let data_pref_array = []
        const data_id2data = {}
        const data_idx2id = {}
        const data_pref2idx = {}
        async function loadData() {
            [
                data_pref_array,
                data_kessan,
                data_todohuken,
                data_zeimoku,
                data_named_card
            ] = await Promise.all([
                fetch("pref-array.json").then(e => e.json()),
                loadFile("r5_kessan_data.parquet"),
                loadFile("r5_kessan_todohuken.parquet"),
                loadFile("zeimoku.parquet"),
                loadFile("r5_kessan_data_named_card.parquet")
            ])


            data_pref_array.forEach((val, idx) => {
                data_pref2idx[val] = idx
            })

            function buildId2name() {
                setTimeout(() => {
                    data_kessan.forEach(item => {
                        const id = item['id']
                        Object.assign(data_id2data, { [id]: item })
                    })
                }, 0)
                setTimeout(() => {
                    data_todohuken.forEach(item => {
                        const id = item['id']
                        Object.assign(data_id2data, { [id]: item })
                    })
                }, 0)
            }
            buildId2name()
        }

        async function loadFile(url2fetch) {
            const response = await fetch(url2fetch)
            if (response.status !== 200) {
                console.error("error")
            }
            const arrayBuffer = await response.arrayBuffer()

            const metadata = parquetMetadata(arrayBuffer)
            const columns = metadata.schema.slice(1).map(s => s.name)

            let records = []
            await parquetRead({
                file: arrayBuffer,
                onComplete: (rows) => {
                    records = rows.map(row =>
                        Object.fromEntries(columns.map((col, i) => [col, row[i]]))
                    )
                },
            })
            return records
        }

        // ══════════════════════════════════════════════
        // STATE
        // ══════════════════════════════════════════════
        let currentView = 'card'

        // ══════════════════════════════════════════════
        // ROUTER
        // ══════════════════════════════════════════════
        window.navigate = function navigate(path) {
            window.location.hash = path
        }

        window.copyCurrentUrl = function copyCurrentUrl() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const btn = document.getElementById('copy-url-btn')
                const original = btn.innerHTML
                btn.innerHTML = '&#10003; コピーしました'
                btn.classList.add('copy-url-btn--copied')
                setTimeout(() => {
                    btn.innerHTML = original
                    btn.classList.remove('copy-url-btn--copied')
                }, 1800)
            })
        }


        function parseHash() {
            const raw = window.location.hash.slice(1)
            const [path, qs] = raw.split('?')
            return { path: path || '/', params: new URLSearchParams(qs ?? '') }
        }

        function showPanel(id) {
            document.querySelectorAll('.tab-panel').forEach(p => {
                p.classList.remove('active')
            })
            document.getElementById(id)?.classList.add('active')
        }

        function renderRoute() {
            const { path, params } = parseHash()
            const id = params.get('id')

            document.getElementById('searchbar').style.display = path === '/' ? '' : 'none'
            document.getElementById('backbar').style.display = path === '/detail' ? '' : 'none'
            console.log(data_id2data[id], data_id2data)
            if (path === '/') {
                showPanel('tab-browse')
                onFilterChange()
            } else if (path === '/detail' && data_id2data[id]) {
                showPanel('tab-detail')
                renderDetail(id)
            } else {
                showPanel('tab-notfound')
                renderNotFound()
            }
            document.getElementById('tab-loading').classList.remove('active');
        }
        window.addEventListener('hashchange', renderRoute)

        // ══════════════════════════════════════════════
        // BROWSE — card render (H案: 縦型ヒーロー)
        // ══════════════════════════════════════════════
        /**
         * ブラウズ画面用カード（H案）のHTML文字列を生成する。
         * ヘッダーに自治体名・都道府県名、ボディに右寄せの大きな金額を表示する縦型レイアウト。
         *
         * @param {Object} e - カードに表示するエンティティデータ
         * @param {string} e.id        - データ識別のためのID
         * @param {string} e.title     - 自治体名
         * @param {string} e.subtitle  - 都道府県名
         * @param {string} e.badge     - 市町村類型（例: "政令指定都市"）
         * @param {number} e.value     - スコアの数値
         * @param {string} e.unit      - スコアの単位（例: "百万円"）
         * @returns {string} カードの HTML 文字列
         */
        function renderCardCompact(e) {
            const badge = e.badge ? `<span class="ch-badge">${e.badge}</span>` : ''
            return `
                <div class="card-h" data-id="${e.id}" onclick="selectCard('${e.id}')">
                    <div class="ch-header">
                        <div class="ch-header-left">
                            <div class="ch-pref">${e.subtitle}</div>
                            <div class="ch-name">${e.title}</div>
                        </div>
                        ${badge}
                    </div>
                    <div class="ch-body">
                        <div class="ch-value-name">${e.valueName}</div>
                        <div class="ch-amount">${fmtScore(e.value)}</div>
                        <div class="ch-unit">${e.unit}</div>
                    </div>
                </div>
            `
        }

        // ══════════════════════════════════════════════
        // BROWSE — card render (D案: rows グリッド型)
        // ══════════════════════════════════════════════
        /**
         * ブラウズ画面用カード（D案）のHTML文字列を生成する。
         * C案より多くのデータを表示する rows グリッド型レイアウト。
         *
         * @param {Object}   e            - カードに表示するエンティティデータ
         * @param {number}   e.id         - allData内の要素をはじめ、すべてのEntityを一意に定めるID
         * @param {string}   e.title      - 自治体名
         * @param {string}   e.subtitle   - 都道府県名
         * @param {string}   [e.badge]    - 市町村類型（例: "政令指定都市"）
         * @param {Array<{label: string, value: string}>} e.rows - 表示する指標の配列
         * @returns {string} カードの HTML 文字列
         */
        function renderCardData(d) {
            const id = d['id']
            const rows = d['rows'] ?? []
            const getUnit = (idx) => {
                const unit = ["人", "km2"][idx]
                return unit
                if (unit) {
                    return unit
                }
            }
            return `
              <div class="entity-card" data-id="${id}" onclick="selectCard('${id}')">
                    <span class="ec-sub">${d.subtitle}</span>
                    <div class="ec-head">
                        <span class="ec-name">
                            ${d.title}
                        </span>
                        <span class="ec-badge">${d.badge}</span>
                    </div>
                    <div class="ec-rows">
                        ${rows.map((e, idx) => `
                            <div class="ec-row">
                                <span class="ec-label">${e.label}</span>
                                <span class="ec-value">${fmtScore(e.value, getUnit(idx))}</span>
                            </div>
                        `).join("")}
                    </div>
                </div>
            `
        }

        function groupBySubtitle(entities) {
            const map = new Map()

            for (const e of entities) {
                const key = e.subtitle ?? ''

                if (!map.has(key)) {
                    map.set(key, [])
                }

                map.get(key).push(e)
            }

            const stack = []
            for (const [key, val] of map.entries()) {
                val.sort((a, b) => a.dantaiCode - b.dantaiCode)
                stack.push([key, val])
            }


            // 都道府県 sort
            stack.sort((a, b) => {
                const aVal = a[0];
                const bVal = b[0];
                return data_pref2idx[bVal] - data_pref2idx[aVal]
            })
            return stack
        }

        function renderGroupHeader(subtitle) {
            return `
                <div class="group-header">
                    <span class="gh-name">${subtitle}</span>
                </div>
                `
        }

        let _latestSeachQuery = ''
        function renderBrowseCards(entities, searchQuery) {
            if ('' !== searchQuery.trim() && _latestSeachQuery === searchQuery) {
                return
            }
            _latestSeachQuery = searchQuery
            const grid = document.getElementById('tab-browse')
            grid.innerHTML = ''

            const pref2itemToBeRendered = groupBySubtitle(entities)

            function renderChunk() {
                if ('' === searchQuery.trim() || _latestSeachQuery !== searchQuery) {
                    return
                }

                const stackItem = pref2itemToBeRendered.pop()
                if (!stackItem) {
                    return;
                }
                const tmp = document.createElement('div')

                const [key, itemArray] = stackItem
                tmp.innerHTML += renderGroupHeader(key)
                tmp.innerHTML += itemArray.map(renderCardData).join('')

                while (tmp.firstChild) {
                    grid.appendChild(tmp.firstChild)
                }

                requestAnimationFrame(renderChunk);
            }
            requestAnimationFrame(renderChunk);
        }

        window.selectCard = function selectCard(id) {
            navigate(`/detail?id=${id}`)
        }

        function renderNotFound() {
            document.getElementById('tab-notfound').innerHTML = `
                <div class="not-found">
                    <div class="nf-code">404</div>
                    <div class="nf-msg">ページが見つかりません</div>
                    <button class="nf-btn" onclick="navigate('/')">← ホームへ戻る</button>
                </div>
            `
        }

        // ══════════════════════════════════════════════
        // DETAIL — 歳入の状況テーブル（案A）
        // ══════════════════════════════════════════════

        /**
         * テーブル（案A）のHTML文字列を生成する。
         *
         * @param {{
         *   title:   string,
         *   rows:    Array<{ [key: string]: string, depth?: number, highlightRow?: boolean, isFooter?: boolean }>,
         *   headers: Array<{ label: string, key: string, right: boolean }>,
         *   badge: { title: string, value: string, color: string };
         * }} card - formatRevStats() の戻り値に準じた構造
         * @returns {string} HTML文字列
         */
        function renderDataTable({ title, rows, headers, badge }) {
            const thead = `<thead><tr>
                ${headers.map(h => `<th>${h.label}</th>`).join('')}
            </tr></thead>`

            const key2unit = Object.fromEntries(headers.map(e => [e.key, e.unit]))

            const mkCells = (row) => {
                return headers.map((h, i) => {
                    let val = row[h.key] ?? '—'
                    const valExists = val !== '—'

                    const unit = key2unit[h.key]
                    if (valExists && unit) {
                        val += unit
                    }

                    const classList = []
                    if (h.right) {
                        classList.push("tr-right")
                    }
                    const depthClass = (i === 0 && row.depth > 0) ? ` depth-${row.depth}` : ''
                    classList.push(depthClass)

                    return `<td class="${classList.join("")}">
                        ${val}
                    </td>`
                }).join('')
            }

            const includeHighlightRow = (check) => {
                if (check) {
                    return "tr-subtotal"
                } else {
                    return ""
                }
            }

            const tbody = `<tbody>
                ${rows.filter(r => !r.isFooter).map(row => `
                <tr class="${includeHighlightRow(row.highlightRow)}">
                    ${mkCells(row)}
                </tr>
                `).join('')}
            </tbody>`

            const footerRows = rows.filter(r => r.isFooter)
            let tfoot = ""
            if (footerRows.length > 0) {
                tfoot = `<tfoot>${footerRows.map(row => `<tr>${mkCells(row)}</tr>`).join('')}</tfoot>`
            }

            let colGroup = ''
            if (headers.length == 3) {
                colGroup += `<colgroup>
                    <col width="50%">
                    <col width="40%">
                    <col width="10%">
                </colgroup>`
            } else if (headers.length == 4) {
                colGroup += `<colgroup>
                    <col width="50%">
                    <col width="10%">
                    <col width="10%">
                    <col width="10%">
                </colgroup>`
            } else if (headers.length == 5) {
                colGroup += `<colgroup>
                    <col width="50%">
                    <col width="10%">
                    <col width="10%">
                    <col width="10%">
                    <col width="10%">
                </colgroup>`
            }
            return `
            <div class="datatable"> 
                <div class="datatable-wrap">
                    <div class="datatable-title">
                        <span>${title}</span>
                        ${badge ? `<span class="datatable-badge" style="color:${badge.color ?? 'var(--orange-dim)'}">▮ ${badge.title} ${badge.value}</span>` : ''}
                    </div>
                    <table class="datatable">
                        ${colGroup}
                        ${thead}
                        ${tbody}
                        ${tfoot}
                    </table>
                </div>
            </div>
            `
        }

        /**
        * @param {string} title
        * @param { label: string; value: boolean; }[] string2bool
        * @returns {string} HTML
        */
        function renderBoolInlineZ({ title, items }) {
            const truthy = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg>`
            const falsethy = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/>
                <line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`
            const itemsHtml = items.map((item) => `
                <div class="bool-item ${item.value ? 'is-true' : 'is-false'}" >
                    <span class="bool-mark">${item.value ? truthy : falsethy}</span>
                    <span class="bool-name">${item.label}</span>
                </div> `).join('')

            return `<div class="bool-wrap">
                <div class="datatable-title">${title}</div>
                <div class="bool-inline">${itemsHtml}</div>
            </div>`
        }

        /**
         * @param {{
         *   title: string,
         *   items: Array<{ label: string, prev: number|string, current: number|string }>,
         *   fmt?: (v: number) => string
         * }} opts
         * @returns {string} HTML
         */
        function renderTwoYearCompare({ title, items, fmt }) {
            const format = (v) => {
                if (typeof v === 'number' && fmt) return fmt(v)
                if (typeof v === 'number') return v.toLocaleString('ja-JP')
                return v ?? '—'
            }

            const rows = items.map(({ label, prev, current }) => {
                const vPrev = format(prev)
                const vCurr = format(current)

                let deltaCell = '<td class="tr-right two-year-td-delta">—</td>'
                if (typeof prev === 'number' && typeof current === 'number') {
                    const delta = current - prev
                    const cls = delta > 0 ? 'is-up' : delta < 0 ? 'is-down' : 'is-flat'
                    const sign = delta > 0 ? '+' : ''
                    const deltaStr = fmt ? fmt(delta) : delta.toLocaleString('ja-JP')
                    deltaCell = `<td class="tr-right two-year-td-delta ${cls}">${sign}${deltaStr}</td>`
                }

                return `<tr>
                    <td>${label}</td>
                    <td class="tr-right">${vPrev}</td>
                    <td class="tr-right two-year-td-current">${vCurr}</td>
                    ${deltaCell}
                </tr>`
            }).join('')

            return `<div class="datatable">
                <div class="datatable-wrap">
                    <div class="datatable-title">${title}</div>
                    <table class="datatable">
                        <colgroup>
                            <col width="40%">
                            <col width="20%">
                            <col width="20%">
                            <col width="20%">
                        </colgroup>
                        <thead><tr>
                            <th>項目</th>
                            <th>2017</th>
                            <th>2023</th>
                            <th>変化</th>
                        </tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            </div>`
        }

        // ══════════════════════════════════════════════
        // DETAIL — 円グラフ案A (塗りつぶし円 + サイドリスト)
        // ══════════════════════════════════════════════

        const PIE_COLORS = [
            '#fb8b1e', '#a29bfe', '#ef5777', '#2ecc71', '#eb3b5a',
            '#e056fd', '#fda04a', '#20bf6b', '#45aaf2', '#f7b731', '#888888',
        ]

        /**
         * 円グラフ（案A: 塗りつぶし円 + サイドリスト）のHTML文字列を生成する。
         * innerHTML への挿入後、ECharts の初期化が自動でスケジュールされる。
         *
         * @param {{
         *   title:   string,
         *   rows:    Array<{ [key: string]: string|number, depth?: number, highlightRow?: boolean, isFooter?: boolean }>,
         *   headers: Array<{ name: string, key: string }>
         * }} card - renderDataTable() と同形式。valueキー（headers[1].key）の値は数値を渡すこと。
         * @returns {string} HTML文字列
         */
        function renderPieChartCard({ chartId, title, rows, headers }) {
            const nameKey = headers[0].key
            const valueKey = headers[1]?.key ?? headers[0].key

            // depth-0 のみをグラフ対象とする（depth 未指定の場合は全行）
            const chartRows = rows.filter(r => !r.isFooter && (r.depth === 0 || r.depth == null))
            const items = chartRows.map((row, i) => ({
                name: String(row[nameKey] ?? '—'),
                value: Number(row[valueKey]) || 0,
                color: PIE_COLORS[i % PIE_COLORS.length],
            }))

            const total = items.reduce((s, d) => s + d.value, 0)

            const fmtPct = v => total > 0 ? `${(v / total * 100).toFixed(1)}%` : '—'

            const listHtml = items.map((d, i) => `
                <div class="donut-item" data-index="${i}">
                    <div class="donut-item-name">
                        <div class="donut-item-dot" style="background:${d.color}"></div>
                        <span>${d.name}</span>
                    </div>
                    <div class="donut-item-value">${fmtScore(d.value * 100)}</div>
                    <div class="donut-item-pct">${fmtPct(d.value)}</div>
                </div>
            `).join('')

            // DOM挿入後に ECharts を初期化
            setTimeout(() => {
                const el = document.getElementById(chartId)
                if (!el || !window.echarts) return

                const chart = echarts.init(el, 'dark', { backgroundColor: 'transparent' })

                chart.setOption({
                    tooltip: {
                        backgroundColor: '#1a1a1a',
                        borderColor: '#ff6600',
                        borderWidth: 1,
                        textStyle: { color: '#e8e8e8', fontFamily: '"Share Tech Mono", monospace', fontSize: 11 },
                        appendToBody: true,
                        formatter: p => `${p.name}<br/><b>${fmtScore(p.value * 100)}</b> (${fmtPct(p.value)})`,
                    },
                    series: [{
                        type: 'pie',
                        radius: '46%',
                        center: ['50%', '50%'],
                        nodeClick: false,
                        data: items.map(d => ({
                            name: d.name,
                            value: d.value,
                            itemStyle: { color: d.color, borderColor: '#0a0a0a', borderWidth: 1.5 },
                        })),
                        label: {
                            show: true,
                            position: 'outside',
                            fontFamily: '"Noto Sans JP", sans-serif',
                            formatter: p => {
                                const pv = p.value / total * 100
                                if (pv >= 8) return `{n|${p.name}}\n{p|${pv.toFixed(1)}%}`
                                if (pv >= 4) return `{p|${pv.toFixed(1)}%}`
                                return ''
                            },
                            rich: {
                                n: {
                                    fontSize: 13, color: '#e8e8e8', lineHeight: 20,
                                    fontFamily: '"Noto Sans JP", sans-serif',
                                    textBorderColor: 'rgba(0,0,0,0.8)', textBorderWidth: 3
                                },
                                p: {
                                    fontSize: 13, color: '#fff', fontWeight: 'bold',
                                    fontFamily: '"Share Tech Mono", monospace',
                                    textBorderColor: 'rgba(0,0,0,0.8)', textBorderWidth: 3
                                },
                            },
                        },
                        labelLine: {
                            length: 24, length2: 40, smooth: true,
                            lineStyle: { color: '#555', width: 1.2 },
                        },
                        labelLayout: { hideOverlap: true, moveOverlap: 'shiftY', margin: 6 },
                        emphasis: {
                            scale: true, scaleSize: 5,
                            itemStyle: { borderColor: '#fff', borderWidth: 1.5 },
                        },
                    }],
                })

                // リスト ↔ チャート 連動
                const listInner = el.closest('.donut-layout').querySelector('.donut-list-inner')
                let activeIdx = -1

                function setActive(idx) {
                    if (idx === activeIdx) return
                    if (activeIdx >= 0) {
                        chart.dispatchAction({ type: 'downplay', seriesIndex: 0, dataIndex: activeIdx })
                        listInner.querySelector(`[data-index="${activeIdx}"]`)?.classList.remove('active')
                    }
                    activeIdx = idx
                    if (idx >= 0) {
                        chart.dispatchAction({ type: 'highlight', seriesIndex: 0, dataIndex: idx })
                        const item = listInner.querySelector(`[data-index="${idx}"]`)
                        item?.classList.add('active')
                        item?.scrollIntoView({ block: 'nearest' })
                    }
                }

                listInner.addEventListener('mouseover', e => {
                    const item = e.target.closest('.donut-item')
                    if (item) setActive(+item.dataset.index)
                })
                listInner.addEventListener('mouseout', () => setActive(-1))
                chart.on('mouseover', p => setActive(items.findIndex(d => d.name === p.name)))
                chart.on('mouseout', () => setActive(-1))

                new ResizeObserver(() => chart.resize()).observe(el)
                window.addEventListener('resize', () => chart.resize())
            }, 0)

            return `
                <div class="donut-layout">
                    <div class="donut-header">${title}</div>
                    <div class="donut-body">
                        <div class="donut-chart-col">
                            <div id="${chartId}" class="donut-chart-el"></div>
                        </div>
                        <div class="donut-list-col">
                            <div class="donut-list-header">
                                <span>${headers[0].name}</span>
                                <span>${headers[1]?.name ?? ''}</span>
                                <span>構成比</span>
                            </div>
                            <div class="donut-list-inner">${listHtml}</div>
                        </div>
                    </div>
                </div>
            `
        }

        // ══════════════════════════════════════════════
        // DETAIL — 横積み棒グラフ（datatable スタイル）
        // ══════════════════════════════════════════════

        /**
         * 横積み棒グラフのHTML文字列を生成する。
         * 同じ depth の行は同じ棒に積み上げ、depth が大きいほど下に表示する。
         *
         * @param {{
         *   chartId: string,
         *   title:   string,
         *   rows:    Array<{ [key: string]: string|number, depth?: number, isFooter?: boolean }>,
         *   headers: Array<{ name: string, key: string }>
         * }} params
         * @returns {string} HTML文字列
         */
        function renderStackedBarCard({ chartId, title, rows, headers }) {
            const nameKey = headers[0].key
            const valueKey = headers[1]?.key ?? headers[0].key

            const ITEM_COLORS = [
                '#ff6600', '#fb8b1e', '#a29bfe', '#45aaf2', '#2ecc71',
                '#ef5777', '#fda04a', '#e056fd', '#20bf6b', '#f7b731', '#888888',
            ]

            const chartRows = rows
                .filter(r => !r.isFooter)
                .map((r, i) => ({ ...r, _origIdx: i }))

            // category でグループ化（未指定は空文字列でひとまとめ）
            const catOrder = []
            const catMap = new Map()
            chartRows.forEach(r => {
                const cat = r.category ?? ''
                if (!catMap.has(cat)) { catOrder.push(cat); catMap.set(cat, []) }
                catMap.get(cat).push(r)
            })
            const hasCategory = catOrder.some(c => c !== '')

            // グループごとにチャートデータを計算
            const groups = catOrder.map((cat, gi) => {
                const cRows = catMap.get(cat)
                const rootItems = cRows.filter(r => (r.depth ?? 0) === 0)
                const rootNames = rootItems.map(r => String(r[nameKey] ?? '—'))
                const rootValues = Object.fromEntries(
                    rootItems.map(r => [String(r[nameKey] ?? '—'), Number(r[valueKey]) / 100 || 0])
                )

                let curRoot = null
                const depth1ByRoot = Object.fromEntries(rootNames.map(n => [n, []]))
                cRows.forEach(r => {
                    const d = r.depth ?? 0
                    if (d === 0) { curRoot = String(r[nameKey] ?? '—') }
                    else if (d === 1 && curRoot) {
                        depth1ByRoot[curRoot].push({
                            name: String(r[nameKey] ?? '—'),
                            value: Number(r[valueKey]) / 100 || 0,
                        })
                    }
                })

                const depth1Names = [...new Map(
                    rootNames.flatMap(rn => depth1ByRoot[rn].map(x => [x.name, x]))
                ).keys()]

                const depth1Series = depth1Names.map((name, i) => ({
                    name,
                    type: 'bar',
                    stack: 'total',
                    data: rootNames.map(rn => depth1ByRoot[rn].find(x => x.name === name)?.value ?? 0),
                    itemStyle: { color: ITEM_COLORS[i % ITEM_COLORS.length] },
                    emphasis: { focus: 'series' },
                }))

                const sonoTaSeries = {
                    name: 'その他',
                    type: 'bar',
                    stack: 'total',
                    data: rootNames.map(rn => {
                        const childSum = depth1ByRoot[rn].reduce((s, x) => s + x.value, 0)
                        return Math.max(0, (rootValues[rn] ?? 0) - childSum)
                    }),
                    itemStyle: { color: '#3a3a3a' },
                    emphasis: { focus: 'series' },
                }

                const series = [...depth1Series, sonoTaSeries]
                const legendRows = Math.ceil((depth1Names.length + 1) / 4)
                const barHeight = Math.max(rootNames.length * 40 + legendRows * 20 + 80, 160)

                return { cat, elId: `${chartId}-g${gi}`, rootNames, series, legendRows, barHeight, rootValues }
            })

            // 全グループ横断で最大値を統一
            const globalMax = Math.max(...groups.flatMap(g => Object.values(g.rootValues)))

            // ECharts 初期化（全グループ）
            setTimeout(() => {
                groups.forEach(g => {
                    const el = document.getElementById(g.elId)
                    if (!el || !window.echarts) return

                    const chart = echarts.init(el, 'dark', { backgroundColor: 'transparent' })
                    chart.setOption({
                        legend: {
                            type: 'scroll',
                            bottom: 0,
                            left: 'center',
                            itemWidth: 10,
                            itemHeight: 10,
                            textStyle: {
                                color: '#888',
                                fontFamily: '"Share Tech Mono", monospace',
                                fontSize: 10,
                            },
                            pageTextStyle: { color: '#888' },
                            pageIconColor: '#ff6600',
                            pageIconInactiveColor: '#444',
                        },
                        tooltip: {
                            trigger: 'item',
                            backgroundColor: '#1a1a1a',
                            borderColor: '#ff6600',
                            borderWidth: 1,
                            textStyle: {
                                color: '#e8e8e8',
                                fontFamily: '"Share Tech Mono", monospace',
                                fontSize: 11,
                            },
                            appendToBody: true,
                            formatter: p => `${p.seriesName}<br/><b>${fmtScore(p.value * 100)}</b>`,
                        },
                        grid: { left: 8, right: 16, top: 8, bottom: g.legendRows * 20 + 28, containLabel: true },
                        xAxis: {
                            type: 'value',
                            axisLabel: {
                                color: '#555',
                                fontFamily: '"Share Tech Mono", monospace',
                                fontSize: 10,
                                formatter: (v) => fmtScore(v)
                            },
                            max: globalMax,
                            splitLine: { lineStyle: { color: '#2a2a2a' } },
                        },
                        yAxis: {
                            type: 'category',
                            data: g.rootNames,
                            inverse: true,
                            axisLabel: {
                                color: '#888',
                                fontFamily: '"Share Tech Mono", monospace',
                                fontSize: 11,
                            },
                            axisLine: { lineStyle: { color: '#2a2a2a' } },
                            axisTick: { lineStyle: { color: '#2a2a2a' } },
                        },
                        series: g.series,
                    })

                    new ResizeObserver(() => chart.resize()).observe(el)
                    window.addEventListener('resize', () => chart.resize())
                })
            }, 0)

            const bodyHtml = groups.map(g => `
                ${hasCategory ? `<div class="datatable-category-header">${g.cat}</div>` : ''}
                <div id="${g.elId}" style="width:100%;height:${g.barHeight}px;"></div>
            `).join('')

            return `
            <div class="datatable">
                <div class="datatable-wrap">
                    <div class="datatable-title">${title}</div>
                    ${bodyHtml}
                </div>
            </div>
            `
        }

        // ══════════════════════════════════════════════
        // DETAIL — header card (基礎情報)
        // ══════════════════════════════════════════════
        function renderDetailHeader(id) {
            const d = data_id2data[id]
            const isDantai = d['団体名'] != null
            const title = isDantai ? d['団体名'] : d['都道府県名']
            const subtitle = isDantai ? d['都道府県名'] : ''
            const badge = isDantai ? d['市町村類型'] : '都道府県'

            const fmt = (v, unit = '') => {
                const n = Number(v)
                if (v == null || v === '' || !Number.isFinite(n)) return '—'
                return n.toLocaleString('ja-JP') + (unit ? '\u00a0' + unit : '')
            }

            const stats = [
                { label: '人口（令和2年国調）', value: fmt(d['人口.令和2年国調'], '人') },
                { label: '面積', value: fmt(d['面積_km2'], 'km²') },
                { label: '人口密度', value: fmt(d['人口密度_人_per_km2'], '人/km²') },
                { label: '財政力指数', value: fmt(d['財政指標.財政力指数.令和5年度']) },
            ]

            const statsHtml = stats.map(s => `
                <div class="dh-stat">
                    <span class="dh-stat-label">${s.label}</span>
                    <span class="dh-stat-value">${s.value}</span>
                </div>`).join('')

            return `
                <div class="detail-header-card">
                    <div class="dh-top">
                        <div class="dh-name-block">
                            <div class="dh-meta">
                                ${subtitle ? `<span class="dh-subtitle">${subtitle}</span>` : ''}
                            </div>
                            <div class="dh-title">${title}</div>
                        </div>
                        <span class="dh-tag">${badge}</span>
                    </div>
                    <div class="dh-stats">${statsHtml}</div>
                </div>`
        }

        // ══════════════════════════════════════════════
        // DETAIL — placeholder
        // ══════════════════════════════════════════════
        import {
            SICHOSON_UI_SangyoKouzou,
            SICHOSON_UI_SainyuJyokyo,
            SICHOSON_UI_CHART_SainyuJyokyo,
            SICHOSON_UI_SichosonZeiJyokyo,
            SICHOSON_UI_ItibukumiaiJyokyo,
            SICHOSON_UI_Siteidantai,
            SICHOSON_UI_SyokuinKyuyo,
            SICHOSON_UI_ShokuinTokubetsu,
            SICHOSON_UI_Seisitsu,
            SICHOSON_UI_Mokuteki,
            SICHOSON_UI_Shushi,
            SICHOSON_UI_Kikin,
            SICHOSON_UI_SaimuHutan,
            SICHOSON_UI_Choshu,
            SICHOSON_UI_Jinkou,
            SICHOSON_UI_Kenzenka,
            SICHOSON_UI_ZaiseiSihyo,
            fmtScore
        } from './detail-sichoson-components.js'
        import { renderPieChart } from './pieChart.js'

        import { renderKokuminkenkohoken, renderKoeiJigyo } from './render-kokuhoken-koei.js'
        import {

            DOHUKEN_UI_Seishitsu,
            DOHUKEN_UI_Mokuteki,
            DOHUKEN_UI_ZaiseiShihyo,
            DOHUKEN_UI_ShisanSaimu,
            DOHUKEN_UI_Kaikei,
            DOHUKEN_UI_SyokuinKyuyo,

        } from './dohukenzei.js'

            tabDetailElm.innerHTML += renderDetailHeader(id)
            tabDetailElm.innerHTML += renderKpiCardGroup(DOHUKEN_UI_Syushi(dataItem))
            tabDetailElm.innerHTML += renderKpiCardGroup(DOHUKEN_UI_ZaiseiShihyo(dataItem))
            tabDetailElm.innerHTML += renderKpiCardGroup(DOHUKEN_UI_ShisanSaimu(dataItem))
            tabDetailElm.innerHTML += `<div class="detail-row">
                ${renderKpiCardGroup(DOHUKEN_UI_SaimuHutanKoui(dataItem))}
                ${renderKpiCardGroup(DOHUKEN_UI_Kaikei(dataItem))}
            </div>`
            tabDetailElm.innerHTML += `<div class="detail-row">${renderDataTable(DOHUKEN_UI_SainyuJyokyo(dataItem))}</div>`
            tabDetailElm.innerHTML += `<div class="detail-row">${renderDataTable(DOHUKEN_UI_DohukenZeiJyokyo(dataItem))}</div>`
            tabDetailElm.innerHTML += `<div class="detail-row">
                ${renderDataTable(DOHUKEN_UI_Seishitsu(dataItem))}
                <div class="detail-col">
                    ${renderDataTable(DOHUKEN_UI_Mokuteki(dataItem))}
                </div>
            </div>`
            tabDetailElm.innerHTML += `<div class="detail-row">
                ${renderDataTable(DOHUKEN_UI_SyokuinKyuyo(dataItem))}
                ${renderDataTable(DOHUKEN_UI_SyokuinTokubetsu(dataItem))}
            </div>`
        }

        function renderDetail(id) {
            const dataItem = data_id2data[id]
            if (dataItem['団体名'] == null) {
                return renderDohukenDetail(id)
            }

            const tabDetailElm = document.getElementById('tab-detail')
            tabDetailElm.innerHTML = ''
            const tokubetuShoku = SICHOSON_UI_ShokuinTokubetsu(dataItem)

            const sainyuJyokyo = SICHOSON_UI_SainyuJyokyo(dataItem)

            const sangyoKouzou = SICHOSON_UI_SangyoKouzou(dataItem)
            const sichosonZei = SICHOSON_UI_SichosonZeiJyokyo(dataItem)

            const seisitsu = SICHOSON_UI_Seisitsu(dataItem)
            const mokuteki = SICHOSON_UI_Mokuteki(dataItem)

            // smaller
            const syokuinkyuyo = SICHOSON_UI_SyokuinKyuyo(dataItem)

            // checks
            const itibukumiai = SICHOSON_UI_ItibukumiaiJyokyo(dataItem)
            const shiteidantai = SICHOSON_UI_Siteidantai(dataItem)

            tabDetailElm.innerHTML += renderDetailHeader(id)
            tabDetailElm.innerHTML += `<div class="detail-row">${renderKpiCardGroup(SICHOSON_UI_Shushi(dataItem))}</div>`

            tabDetailElm.innerHTML += `<div class="detail-row">
                ${renderKpiCardGroup(SICHOSON_UI_Kikin(dataItem))}
                ${renderKpiCardGroup(SICHOSON_UI_SaimuHutan(dataItem))}
                ${renderKpiCardGroup(SICHOSON_UI_Choshu(dataItem))}
            </div>`

            tabDetailElm.innerHTML += `
                <div class="detail-row">
                    ${renderKpiCardGroup(SICHOSON_UI_ZaiseiSihyo(dataItem))}
                    ${renderKokuminkenkohoken(dataItem)}
                </div>
            `

            tabDetailElm.innerHTML += `
                <div class="detail-row">
                    ${renderKpiCardGroup(SICHOSON_UI_SangyoKouzou(dataItem))}
                    ${renderKpiCardGroup(SICHOSON_UI_Jinkou(dataItem))}
                </div>
                
                <div class="detail-row">
                    ${renderDataTable(sainyuJyokyo)}
                </div>
                <div class="detail-row">
                    ${renderDataTable(sichosonZei)}
                </div>
                <div class="detail-row">
                    ${renderDataTable(seisitsu)}
                    <div class="detail-col">
                        ${renderDataTable(mokuteki)}
                        ${renderKoeiJigyo(dataItem)}
                    </div>
                </div>
                <div class="detail-row">
                    ${renderDataTable(syokuinkyuyo)}
                    ${renderDataTable(tokubetuShoku)}
                </div>
                <div class="detail-row">
                    ${renderBoolInlineZ(itibukumiai)}
                    ${renderBoolInlineZ(shiteidantai)}
                </div>
            `

        }

        // ══════════════════════════════════════════════
        // SEARCH FILTER
        // ══════════════════════════════════════════════
        function onFilterChange() {
            const q = document.getElementById('cb-search').value.trim()
            const keywords = q.split(" ").filter(e => e.length > 0)


            const checkContains = (keywords, needle) => {
                if (typeof needle != 'string') {
                    return false
                }
                for (const word of keywords) {
                    if (needle.includes(word)) {
                        return true
                    }
                }
                return false
            }

            let filtered = data_named_card
            if (keywords.length > 0) {
                filtered = filtered.filter(e =>
                    checkContains(keywords, e.title) ||
                    checkContains(keywords, e.subtitle)
                )
            }

            renderBrowseCards(filtered, q)
            document.querySelector('.search-count-num').textContent = filtered.length.toLocaleString()
        }

        // ══════════════════════════════════════════════
        // INIT
        // ══════════════════════════════════════════════
        let searchTimer
        document.getElementById('cb-search').addEventListener('input', () => {
            clearTimeout(searchTimer)
            searchTimer = setTimeout(onFilterChange, 100)
        })
        loadData().then(() => {
            setTimeout(() => {
                renderRoute()
            }, 1)
        })
    </script>
